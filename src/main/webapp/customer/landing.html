<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>약찾GO</title>
    <link rel="stylesheet" href="customer_style.css" />
    <meta http-equiv="refresh" content="3;url=customer_app.html" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f0f0;
      }

      .content-area {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        text-align: center;
      }

      .landing-text {
        font-size: 1.5em;
        font-weight: bold;
        color: #333;
        margin: 40px 0 10px 0;
      }
      .landing-img {
        width: 13em;
      }
      @font-face {
        font-family: "SBAggroB";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroB.woff")
          format("woff");

        font-style: normal;
      }
      .landing-title {
        font-family: "SBAggroB";
        color: #14b3ae;
        margin: 0;
        font-size: 2em;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <div class="mobile-frame">
      <div class="content-area">
        <img
          class="landing-img"
          src="https://cdn-icons-gif.flaticon.com/9534/9534955.gif"
        />
        <p class="landing-text">당신의 약을 찾아,</p>
        <h2 class="landing-title">약찾GO</h2>
      </div>
    </div>
  </body>
</html>
